#####################
### Hive Deposits ###
#####################

pi_d_hive_planetary_coordination_nodes:0 "§EPlanetary Coordination Nodes"
pi_d_hive_planetary_coordination_nodes_desc:0 "From these nodes the hive coordinates its collective actions with precision, improving the efficiency of specialist drones and the cohesion of the planet's hive overall, resulting in a far more productive super-organism."

pi_d_hive_orbital_colonies:0 "§EBuild Orbital Colonies"
pi_d_hive_orbital_colonies_desc:0 "To sustain the ever-increasing population of drones on this planet, the hive built a series of habitats in orbit. These provide more housing and jobs, but most of all, they free up a significant amount of space on the planet's surface for additional industry."

pi_d_hive_fleet_coordination_nexus:0 "§EFleet Coordination Nexus"
pi_d_hive_fleet_coordination_nexus_desc:0 "This nexus provides the means to drastically alter the way fleet action is undertaken and understood. Significantly improving the communications, calculations and performance of the hive's fleets no matter where they may be in the galaxy. This complex is highly fortified, well-staffed and painstakingly maintained."

pi_d_hive_collective_computing_consciousness:0 "§ECollective Computing Consciousness"
pi_d_hive_collective_computing_consciousness_desc:0 "Through the collective neural capacity of countless drones, this facility contributes greatly to the wider hive's understanding of the universe and how it can be manipulated to its ends. In order to achieve this, drones dedicated to this task are provided with significantly more food and amenities than is standard for drones of equal status."

pi_d_hive_consciousness_synchronization_lattice:0 "§EConsciousness Synchronization Lattice"
pi_d_hive_consciousness_synchronization_lattice_desc:0 "This planet-spanning network of connection points, resting dens and feeding galleries is optimally dispersed across the surface to allow for maximized drone productivity and better coordination within the hive."

pi_d_hive_deep_mantle_exotic_hyperforge:0 "Deep Mantle Exotic Hyperforge"
pi_d_hive_deep_mantle_exotic_hyperforge_desc:0 "Deep below the planet's crust, the hive's most sophisticated bio-forges and matter printers operate without rest. These organic machines toil to produce the most exotic, rare resources of all: dark matter, living metal, and nanites. With these, the multitude is strengthened. Ships, buildings and the unseen infrastructure that keeps the hive connected, all benefit from the resources produced here."

pi_d_hive_gaia_biosphere_preservation_webbing:0 "Biosphere Preservation Webbing"
pi_d_hive_gaia_biosphere_preservation_webbing_desc:0 "On a lattice of levitating pedestals that span across this planet's skies are numerous bio-facilities that labour to preserve the biosphere. Working tirelessly, the drones collect, record and nurture all aspects of the planetary environment for the hive's greater purpose. Through their toil, these drones also, mysteriously, produce small amounts of Zro."

pi_d_hive_space_elevator:0 "§ESpace Elevator"
pi_d_hive_space_elevator_desc:0 "This towering space elevator enables the hive to rapidly transport products, resources and drones from the planet's surface to space and back. All this is achieved at a fraction of the cost of any other method, resulting in a significant increase in output."

pi_d_hive_neural_regulation_nexus:0 "Neural Regulation Nexus"
pi_d_hive_neural_regulation_nexus_desc:0 "This enormous, highly secure facility was built to manage the ever-increasing population of deviant drones on this planet. Depending on how far the drone has deviated, it will either be re-integrated into the greater hive or simply terminated."

pi_d_hive_supplemental_breeding_pools:0 "Supplemental Breeding Pools"
pi_d_hive_supplemental_breeding_pools_desc:0 "This sprawling structure has been built to ensure the planet's ever-growing demand for drones is met no matter the circumstance. Countless drones labor day and night to ensure the pools are supplied with enough essential nutrients to keep a steady swarm of new, fully grown drones entering service every cycle."

pi_d_hive_subsurface_megaforges:0 "Subsurface Megaforges"
pi_d_hive_subsurface_megaforges_desc:0 "These gargantuan forges were built to supply this planet and the greater hive with the high-quality alloys that are always in demand. The forges are worked by swarms of drones at all hours, only rarely being shut down for maintenance to ensure quality is maintained."

pi_d_hive_chemical_hazardous_goods:0 "Hazardous Materials Processing Superfactory"
pi_d_hive_chemical_hazardous_goods_desc:0 "A sprawling facility housing all the industrial equipment required to store, process and recycle the most hazardous goods that the hive uses across its vast network. Efforts are made to limit the effects on the surrounding environment, to ensure it can be exploited for the hive's other needs."

pi_d_hive_orbital_defense_grid:0 "Orbital Defense Grid"
pi_d_hive_orbital_defense_grid_desc:0 "To protect the planet, and the incredibly important industrial sites on its surface, this orbital network of defensive satellites and stations was constructed. Meticulously planned, with overlapping firing arcs to the point of near redundancy, this planet can weather anything the enemy throws at it."

pi_d_hive_worldwide_maglev:0 "Worldwide Maglev System"
pi_d_hive_worldwide_maglev_desc:0 "A web of interconnected maglev lines stretches across every corner of this planet. Transporting both drones and material, this transportation network cuts down on the cost and production times of the most simple of goods to the most complex technology."

pi_d_hive_polar_resource_silos:0 "Polar Resource Silos"
pi_d_hive_polar_resource_silos_desc:0 "In order to store the gargantuan stockpiles of resources this planet requires and ensure that in case of emergencies, there aren't shortages, the poles of this planet have been largely covered with titanic silos, vaults and warehouses. In addition, an army of drones works tirelessly to catalogue, maintain and transport the goods stored here."

pi_d_hive_mineral_extraction_warrens:0 "Mineral Extraction Warrens"
pi_d_hive_mineral_extraction_warrens_desc:0 "Collectively known as the Extraction Warrens by the hive, this network of shafts, tunnels and galleries allows the hive to extract an immense amount of mineral wealth from the planet's crust. As a result, the time it takes to build structures on the planetary surface as well as the cost to maintain them is decreased significantly."

pi_d_hive_nutrient_processing_megaplant:0 "Nutrient Processing Megaplant"
pi_d_hive_nutrient_processing_megaplant_desc:0 "This massive food processing plant serves the drones of this planet and beyond. Producing the highest quality of nutrients from plant or animal matter, anything that doesn't contribute to the hive's collective survival is processed into food, sustaining the never-ending growth of the hive."

pi_d_hive_planetary_fusion_grid:0 "Planetary Fusion Grid"
pi_d_hive_planetary_fusion_grid_desc:0 "Located in strategic, well-fortified locations across the planetary surface are numerous, highly efficient fusion power plants, meticulously maintained and tuned to perfection. Powering every facet of this world, from the climate control of breeding pools to the pumps ensuring a constant supply of nutrients in feeding tubes, they ensure the hive never wants for energy."


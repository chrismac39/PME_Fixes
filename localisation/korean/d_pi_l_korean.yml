pi_d_deep_mantle_exotic_hyperforge:0 "Deep Mantle Exotic Hyperforge"
pi_d_deep_mantle_exotic_hyperforge_desc:0 "Straddling the boundary between the crust and the mantle, this facility produces resources once thought purely fictional. Dark Matter, fueling endless energy production and enhancing shields across the empire. Living Metal, enabling structures to mend on their own. Nanites, revolutionizing medicine and unlocking architectural marvels. These three resources, when used together, have made this planet nearly impossible to bombard from orbit. As a result, these strategic resources are distributed throughout the empire to improve the durability and speed of starships."

pi_d_gaia_biosphere_preservation_webbing:0 "Biosphere Preservation Webbing"
pi_d_gaia_biosphere_preservation_webbing_desc:0 "Arranged in a web-like lattice around the surface of this planet are numerous warehouses, lodges, labs, and staging points. The purpose of these facilities is to sample, index, and maintain the biosphere of this world in perpetuity. Operating out of these sites are the Biosphere Keepers, an exclusive, specialized league of biologists. Through largely unknown means, these biologists have discovered a method to produce Zro directly. They guard this knowledge fiercely."


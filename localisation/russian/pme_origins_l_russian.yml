###########
# Origins #
###########

origin_pme_late_ftl:0 "Позднее явление"
origin_pme_late_ftl_desc:0 "This species has opted to spend an additional century improving their homeworld instead of exploring their solar system, which has resulted in a far higher population on their homeworld and far better-developed infrastructure than most fledgling interstellar nations. \n \n Tragically, a large accident during the construction of two planetary megastructures has resulted in both being ruined, as well as two surrounding projects. This has led to roughly 6% of the planet's population being reduced to living in slums, some of the planet's industry falling into disrepair, and a great deal of land being left unusable due to debris from the accident."

origin_tooltip_pme_late_ftl_effects:0 "-§YЭффекты родного мира§! \n \n - Начните с большого мира с гораздо большим населением и инфраструктурой для поддержки этого населения. \n \n - Начните с двух мощных планетарных мегаинженерных проектов, уже построенных на вашем родном мире, и с исследования первого уровня планетарных инженерных технологий. \n \n Начните с двумя дополнительными заблокированными ячейками в вашем родном мире, очистка которых будет очень дорогостоящей. \n \n -§RНет гарантированно обитаемых миров.§! \n \n -§RОпределенно не сбалансировано.§!"
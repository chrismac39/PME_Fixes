##############################
### Gaia Biosphere Keepers ###
##############################

### Regular ###

job_pi_biosphere_keeper:0 "Biosphere Keeper"
job_pi_biosphere_keeper_plural:0 "Biosphere Keepers"
job_pi_biosphere_keeper_desc:0 "These dedicated $job_pi_biosphere_keeper_plural$ ensure this planet's ecosystems, atmosphere, and oceans remain pristine. They spare no effort, no expense, and always get the job done. Their work also yields the mysterious strategic resource §YZro§!, though few understand how."
job_pi_biosphere_keeper_effect_desc:0 "Decreases pop upkeep, produces Zro."
mod_job_pi_biosphere_keeper_add:0 "$job_pi_biosphere_keeper$ Jobs"
mod_job_pi_biosphere_keeper_per_pop:0 "$job_pi_biosphere_keeper$ from Pops"
mod_job_pi_biosphere_keeper_per_pop_short:0 "$job_pi_biosphere_keeper$"

### Hive ###

job_pi_hive_biosphere_keeper_drone:0 "Biosphere Keeper Drone"
job_pi_hive_biosphere_keeper_drone_plural:0 "Biosphere Keeper Drones"
job_pi_hive_biosphere_keeper_drone_desc:0 "$job_pi_hive_biosphere_keeper_drone_plural$ maintain the planet's ecosystems, atmosphere, and oceans in optimal condition. They do not rest, and as such these drones expire rapidly. Expired drones yield trace amounts of §YZro§!, and are efficiently recycled."
job_pi_hive_biosphere_keeper_drone_effect_desc:0 "Decreases pop upkeep, produces Zro."
mod_job_pi_hive_biosphere_keeper_drone_add:0 "$job_pi_hive_biosphere_keeper_drone$ Jobs"
mod_job_pi_hive_biosphere_keeper_drone_per_pop:0 "$job_pi_hive_biosphere_keeper_drone$ from Pops"
mod_job_pi_hive_biosphere_keeper_drone_per_pop_short:0 "$job_hive_pi_biosphere_keeper_drone$"



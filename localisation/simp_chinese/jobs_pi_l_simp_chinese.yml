job_pi_hyperforge_matterweaver_effect_desc:0 "Converts refined materials into rare strategic resources."
mod_job_pi_hyperforge_matterweaver_add:0 "$job_pi_hyperforge_matterweaver$ Jobs"
mod_job_pi_hyperforge_matterweaver_per_pop:0 "$job_pi_hyperforge_matterweaver$ from Pops"

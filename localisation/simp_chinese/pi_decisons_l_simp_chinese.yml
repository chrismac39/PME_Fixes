######################
### Hive Decisions ###
######################

decision_pi_hive_planetary_coordination_nodes:0 "Build Planetary Coordiantion Nodes"
decision_pi_hive_planetary_coordination_nodes_desc:0 "Build a series of connected neural nodes that will greatly improve the coordination of this planet's drone population."

decision_pi_hive_orbital_colonies:0 "Build Orbital Colonies"
decision_pi_hive_orbital_colonies_desc:0 "Fabricate the titanic space stations required to house a significant portion of this planet's constantly growing drone population."

decision_pi_hive_fleet_coordination_nexus:0 "Build a Fleet Coordination Nexus"
decision_pi_hive_fleet_coordination_nexus_desc:0 "Construct a compound to facilitate the improved coordination of the hive's naval fleets, improving communications, calculations and much more."

decision_pi_hive_collective_computing_consciousness:0 "Build a Collective Computing Consciousness Facility"
decision_pi_hive_collective_computing_consciousness_desc:0 "Build the facilities required to house a swarm of drones that will coordinate the collective brain power of countless drones all in the pursuit of a greater understanding of the universe."

decision_pi_hive_consciousness_synchronization_lattice:0 "Build a Consciousness Synchronization Lattice"
decision_pi_hive_consciousness_synchronization_lattice_desc:0 "Construct the planet-spanning framework of a consciousness synchronization lattice. This lattice will significantly improve the cohesion of the hive on this planet."

decision_pi_hive_deep_mantle_exotic_hyperforge:0 "Build a Deep Mantle Exotic Hyperforge"
decision_pi_hive_deep_mantle_exotic_hyperforge_desc:0 "Excavate a great cavern to house the titanic bio-machines that will create dark matter, living metal and nanites for the hive."

decision_pi_hive_gaia_biosphere_preservation_webbing:0 "Construct a Biosphere Preservation Webbing"
decision_pi_hive_gaia_biosphere_preservation_webbing_desc:0 "Raise the latticework of pedestals that will support a web of bio-preservation-facilities. These will ensure the planets biosphere remains pristine for the hive's use."

decision_pi_hive_space_elevator:0 "Build a Space Elevator"
decision_pi_hive_space_elevator_desc:0 "Undertake the simultaneous construction of a titanic space elevator to drastically reduce the cost of moving drones and materials to and from orbit."

decision_pi_hive_neural_regulation_nexus:0 "Build a Neural Regulation Nexus"
decision_pi_hive_neural_regulation_nexus_desc:0 "Construct an enormous facility to house the deviant drones of this planet, re-integrating them if possible."

decision_pi_hive_supplemental_breeding_pools:0 "Build Supplemental Breeding Pools"
decision_pi_hive_supplemental_breeding_pools_desc:0 "Build the infrastructure in carefully chosen locations on the planetary surface required to support a large number of supplemental breeding pools."

decision_pi_hive_subsurface_megaforges:0 "Subsurface Megaforges"
decision_pi_hive_subsurface_megaforges_desc:0 "Excavate and fortify caverns and within those caverns, construct the titanic forges that will supply the hive with a near-endless flow of high-quality alloys."

decision_pi_hive_chemical_hazardous_goods:0 "Build a Hazardous Materials Processing Superfactory"
decision_pi_hive_chemical_hazardous_goods_desc:0 "Build a sprawling facility that can process, recycle or contain all hazardous goods that the hive requires and uses."

decision_pi_hive_orbital_defense_grid:0 "Build an Orbital Defense Grid"
decision_pi_hive_orbital_defense_grid_desc:0 "Build the countless defense platforms that will defend this world from any form of external threat."

decision_pi_hive_worldwide_maglev:0 "Build a Worldwide Maglev System"
decision_pi_hive_worldwide_maglev_desc:0 "Build a planet-spanning system of maglev rails to reduce the cost of transportation of materials and drones across the surface."

decision_pi_hive_polar_resource_silos:0 "Build Polar Resource Silos"
decision_pi_hive_polar_resource_silos_desc:0 "Construct the warehouses, silos and vaults that will hold the mountains of materials and resources this planet requires to function optimally, as well as emergency stockpiles in case of blockades or other extreme circumstances."

decision_pi_hive_mineral_extraction_warrens:0 "Build Mineral Extraction Warrens"
decision_pi_hive_mineral_extraction_warrens_desc:0 "Excavate and map the preliminary shafts, tunnels and galleries throughout the planet's crust to enable a sophisticated, large-scale mineral extraction operation."

decision_pi_hive_nutrient_processing_megaplant:0 "Build a Nutrient Processing Megaplant"
decision_pi_hive_nutrient_processing_megaplant_desc:0 "Build a massive food processing plant to ensure the drones of this world are always properly nourished."

decision_pi_hive_planetary_fusion_grid:0 "Build a Planetary Fusion Grid"
decision_pi_hive_planetary_fusion_grid_desc:0 "Construct a serious of high-capacity fusion power plants in strategic positions around this planet, ensuring no region is ever without electricity."

